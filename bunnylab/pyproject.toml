[project]
name = "dressing-lab"
version = "0.1.0"
description = "Camera-driven rabbit dressing experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3,<4",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "mujoco-warp>=3.15.0",
    "fast-simplification>=0.2.0",
]

[project.scripts]
dressing = "dressing_lab:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
